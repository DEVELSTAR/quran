<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ───────────────────────────────────────── -->
    <title>Read Holy Quran Chapters Online – AkibWorks</title>
    <meta
      name="description"
      content="Read all Quran chapters online in PDF format. Simple, fast and mobile friendly."
    />
    <meta
      name="keywords"
      content="Quran, Holy Quran, Quran PDF, Quran chapters, read Quran online, Islamic book"
    />
    <meta name="author" content="AkibWorks" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://quran.akibworks.in/" />

    <!-- ── Open Graph ────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quran.akibworks.in/" />
    <meta
      property="og:title"
      content="Read Holy Quran Chapters Online – AkibWorks"
    />
    <meta
      property="og:description"
      content="Read all Quran chapters online in PDF format. Simple, fast and mobile friendly."
    />
    <meta
      property="og:image"
      content="https://quran.akibworks.in/thumbnail/1.webp"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="AkibWorks Quran" />

    <!-- ── Twitter Card ──────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Read Holy Quran Chapters Online – AkibWorks"
    />
    <meta
      name="twitter:description"
      content="Read all Quran chapters online in PDF format. Simple, fast and mobile friendly."
    />
    <meta
      name="twitter:image"
      content="https://quran.akibworks.in/thumbnail/1.webp"
    />

    <!-- ── Favicon ───────────────────────────────────────────── -->
    <link rel="icon" href="favicon.ico" type="image/x-icon" />

    <!-- ── Tailwind CSS (CDN — no heavy JS framework) ────────── -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
            colors: {
              brand: {
                50: "#f0f9f0",
                100: "#dcf0dc",
                500: "#2d7a2d",
                600: "#236023",
                700: "#1a481a",
              },
            },
          },
        },
      };
    </script>

    <!-- ── Google Fonts ──────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ── Inline styles (tiny, no extra request) ────────────── -->
    <style>
      /* Focus-visible ring for keyboard navigation */
      a:focus-visible {
        outline: 3px solid #2d7a2d;
        outline-offset: 3px;
        border-radius: 0.5rem;
      }
      /* Skeleton placeholder while cards load */
      .skeleton {
        background: linear-gradient(
          90deg,
          #e5e7eb 25%,
          #f3f4f6 50%,
          #e5e7eb 75%
        );
        background-size: 200% 100%;
      }
    </style>

    <!-- ── JSON-LD Structured Data ───────────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AkibWorks Quran",
        "url": "https://quran.akibworks.in/",
        "description": "Read all Quran chapters online in PDF format.",
        "author": { "@type": "Organization", "name": "AkibWorks" }
      }
    </script>
  </head>

  <body
    class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col"
  >
    <!-- ════════════════════════════════════════════════════════
       HEADER
  ═══════════════════════════════════════════════════════════ -->
    <header
      class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm"
    >
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <!-- Arabic crescent icon (inline SVG — zero network cost) -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-7 w-7 text-brand-500"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path d="M12 2a10 10 0 1 0 4.93 18.69A8 8 0 0 1 12 2z" />
          </svg>
          <h1
            class="text-xl sm:text-2xl font-bold text-brand-600 tracking-tight leading-tight"
          >
            Holy Quran – Chapters
          </h1>
        </div>
        <!-- Chapter count badge -->
        <span
          id="chapter-count"
          class="text-xs font-semibold bg-brand-100 text-brand-600 rounded-full px-3 py-1 hidden"
        >
          30 Chapters
        </span>
      </div>
    </header>

    <!-- ════════════════════════════════════════════════════════
       MAIN CONTENT
  ═══════════════════════════════════════════════════════════ -->
    <main
      id="main-content"
      class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8"
    >
      <!-- Search input -->
      <div class="mb-6 max-w-sm">
        <label for="search-input" class="sr-only">Search chapters</label>
        <div class="relative">
          <svg
            class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"
            />
          </svg>
          <input
            id="search-input"
            type="search"
            placeholder="Search chapters…"
            aria-label="Search Quran chapters"
            class="w-full pl-9 pr-4 py-2.5 rounded-lg border border-gray-300 bg-white text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
          />
        </div>
      </div>

      <!-- ── Chapter grid ─────────────────────────────────────── -->
      <section aria-label="Quran Chapters">
        <div
          id="chapters-grid"
          class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4"
        >
          <!-- Cards injected by JS -->
        </div>

        <!-- Empty / error state -->
        <p
          id="empty-state"
          class="hidden text-center text-gray-500 mt-16 text-sm"
        >
          No chapters found.
        </p>
      </section>
    </main>

    <!-- ════════════════════════════════════════════════════════
       FOOTER
  ═══════════════════════════════════════════════════════════ -->
    <footer class="bg-white border-t border-gray-200 mt-auto">
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 text-center text-sm text-gray-500"
      >
        &copy; AkibWorks
      </div>
    </footer>

    <!-- ════════════════════════════════════════════════════════
       JAVASCRIPT  (vanilla, no framework)
  ═══════════════════════════════════════════════════════════ -->
    <script>
      (function () {
        "use strict";

        const grid = document.getElementById("chapters-grid");
        const emptyState = document.getElementById("empty-state");
        const countBadge = document.getElementById("chapter-count");
        const searchInput = document.getElementById("search-input");
        let chapters = [];

        /* ── build a single card ── */
        function buildCard(ch) {
          const article = document.createElement("article");
          article.className =
            "group bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden cursor-pointer";
          article.setAttribute("tabindex", "0");
          article.setAttribute("role", "link");
          article.setAttribute("aria-label", `Open ${ch.chapter_name} PDF`);
          article.dataset.name = ch.chapter_name.toLowerCase();

          // Thumbnail wrapper (fixed aspect ratio)
          const imgWrapper = document.createElement("div");
          imgWrapper.className = "relative w-full overflow-hidden bg-gray-100";
          imgWrapper.style.paddingBottom = "133%"; // 3:4 portrait aspect ratio

          const img = document.createElement("img");
          img.src = ch.thumbnail_url;
          img.alt = `Thumbnail for ${ch.chapter_name}`;
          img.loading = "lazy";
          img.decoding = "async";
          img.className =
            "absolute inset-0 w-full h-full object-cover group-hover:opacity-90";

          imgWrapper.appendChild(img);

          // Caption
          const caption = document.createElement("div");
          caption.className = "px-2 py-2.5 border-t border-gray-100";

          const num = document.createElement("span");
          num.className = "block text-xs font-semibold text-brand-500 mb-0.5";
          num.textContent = `Para ${ch.chapter_id}`;

          const name = document.createElement("span");
          name.className =
            "block text-xs sm:text-sm font-medium text-gray-800 leading-snug line-clamp-2";
          name.textContent = ch.chapter_name;

          caption.appendChild(num);
          caption.appendChild(name);
          article.appendChild(imgWrapper);
          article.appendChild(caption);

          /* open PDF on click or Enter/Space */
          const openPdf = () =>
            window.open(ch.pdf_url, "_blank", "noopener,noreferrer");
          article.addEventListener("click", openPdf);
          article.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openPdf();
            }
          });

          return article;
        }

        /* ── render filtered list ── */
        function render(query) {
          const q = (query || "").trim().toLowerCase();
          const filtered = q
            ? chapters.filter(
                (ch) =>
                  ch.chapter_name.toLowerCase().includes(q) ||
                  String(ch.chapter_id) === q,
              )
            : chapters;

          grid.innerHTML = "";
          if (filtered.length === 0) {
            emptyState.classList.remove("hidden");
          } else {
            emptyState.classList.add("hidden");
            filtered.forEach((ch) => grid.appendChild(buildCard(ch)));
          }
        }

        /* ── load chapters ── */
        chapters = [
          { "chapter_id": 1,  "chapter_name": "Al-Fatihah (The Opening)",        "thumbnail_url": "thumbnail/1.webp",  "pdf_url": "pdf/1.pdf"  },
          { "chapter_id": 2,  "chapter_name": "Al-Baqarah (The Cow)",             "thumbnail_url": "thumbnail/2.webp",  "pdf_url": "pdf/2.pdf"  },
          { "chapter_id": 3,  "chapter_name": "Aali Imran (Family of Imran)",     "thumbnail_url": "thumbnail/3.webp",  "pdf_url": "pdf/3.pdf"  },
          { "chapter_id": 4,  "chapter_name": "An-Nisa (The Women)",              "thumbnail_url": "thumbnail/4.webp",  "pdf_url": "pdf/4.pdf"  },
          { "chapter_id": 5,  "chapter_name": "Al-Maidah (The Table Spread)",     "thumbnail_url": "thumbnail/5.webp",  "pdf_url": "pdf/5.pdf"  },
          { "chapter_id": 6,  "chapter_name": "Al-Anam (The Cattle)",             "thumbnail_url": "thumbnail/6.webp",  "pdf_url": "pdf/6.pdf"  },
          { "chapter_id": 7,  "chapter_name": "Al-Araf (The Heights)",            "thumbnail_url": "thumbnail/7.webp",  "pdf_url": "pdf/7.pdf"  },
          { "chapter_id": 8,  "chapter_name": "Al-Anfal (The Spoils of War)",     "thumbnail_url": "thumbnail/8.webp",  "pdf_url": "pdf/8.pdf"  },
          { "chapter_id": 9,  "chapter_name": "At-Tawbah (The Repentance)",       "thumbnail_url": "thumbnail/9.webp",  "pdf_url": "pdf/9.pdf"  },
          { "chapter_id": 10, "chapter_name": "Yunus (Jonah)",                    "thumbnail_url": "thumbnail/10.webp", "pdf_url": "pdf/10.pdf" },
          { "chapter_id": 11, "chapter_name": "Hud (Hud)",                        "thumbnail_url": "thumbnail/11.webp", "pdf_url": "pdf/11.pdf" },
          { "chapter_id": 12, "chapter_name": "Yusuf (Joseph)",                   "thumbnail_url": "thumbnail/12.webp", "pdf_url": "pdf/12.pdf" },
          { "chapter_id": 13, "chapter_name": "Ar-Ra'd (The Thunder)",            "thumbnail_url": "thumbnail/13.webp", "pdf_url": "pdf/13.pdf" },
          { "chapter_id": 14, "chapter_name": "Ibrahim (Abraham)",                "thumbnail_url": "thumbnail/14.webp", "pdf_url": "pdf/14.pdf" },
          { "chapter_id": 15, "chapter_name": "Al-Hijr (The Rocky Tract)",        "thumbnail_url": "thumbnail/15.webp", "pdf_url": "pdf/15.pdf" },
          { "chapter_id": 16, "chapter_name": "An-Nahl (The Bee)",                "thumbnail_url": "thumbnail/16.webp", "pdf_url": "pdf/16.pdf" },
          { "chapter_id": 17, "chapter_name": "Al-Isra (The Night Journey)",      "thumbnail_url": "thumbnail/17.webp", "pdf_url": "pdf/17.pdf" },
          { "chapter_id": 18, "chapter_name": "Al-Kahf (The Cave)",               "thumbnail_url": "thumbnail/18.webp", "pdf_url": "pdf/18.pdf" },
          { "chapter_id": 19, "chapter_name": "Maryam (Mary)",                    "thumbnail_url": "thumbnail/19.webp", "pdf_url": "pdf/19.pdf" },
          { "chapter_id": 20, "chapter_name": "Ta-Ha (Ta-Ha)",                    "thumbnail_url": "thumbnail/20.webp", "pdf_url": "pdf/20.pdf" },
          { "chapter_id": 21, "chapter_name": "Al-Anbiya (The Prophets)",         "thumbnail_url": "thumbnail/21.webp", "pdf_url": "pdf/21.pdf" },
          { "chapter_id": 22, "chapter_name": "Al-Hajj (The Pilgrimage)",         "thumbnail_url": "thumbnail/22.webp", "pdf_url": "pdf/22.pdf" },
          { "chapter_id": 23, "chapter_name": "Al-Muminun (The Believers)",       "thumbnail_url": "thumbnail/23.webp", "pdf_url": "pdf/23.pdf" },
          { "chapter_id": 24, "chapter_name": "An-Nur (The Light)",               "thumbnail_url": "thumbnail/24.webp", "pdf_url": "pdf/24.pdf" },
          { "chapter_id": 25, "chapter_name": "Al-Furqan (The Criterion)",        "thumbnail_url": "thumbnail/25.webp", "pdf_url": "pdf/25.pdf" },
          { "chapter_id": 26, "chapter_name": "Ash-Shuara (The Poets)",           "thumbnail_url": "thumbnail/26.webp", "pdf_url": "pdf/26.pdf" },
          { "chapter_id": 27, "chapter_name": "An-Naml (The Ant)",                "thumbnail_url": "thumbnail/27.webp", "pdf_url": "pdf/27.pdf" },
          { "chapter_id": 28, "chapter_name": "Al-Qasas (The Stories)",           "thumbnail_url": "thumbnail/28.webp", "pdf_url": "pdf/28.pdf" },
          { "chapter_id": 29, "chapter_name": "Al-Ankabut (The Spider)",          "thumbnail_url": "thumbnail/29.webp", "pdf_url": "pdf/29.pdf" },
          { "chapter_id": 30, "chapter_name": "Ar-Rum (The Romans)",              "thumbnail_url": "thumbnail/30.webp", "pdf_url": "pdf/30.pdf" }
        ];

        countBadge.textContent = `${chapters.length} Chapters`;
        countBadge.classList.remove("hidden");
        render("");

        /* ── live search ── */
        let debounceTimer;
        searchInput.addEventListener("input", () => {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => render(searchInput.value), 200);
        });
      })();
    </script>
  </body>
</html>
